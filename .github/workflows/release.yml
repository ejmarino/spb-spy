# Empaqueta la app para Linux y Windows cuando se sube un tag de versión
# (v1.2.3) y publica los paquetes como assets del release de ese tag.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            script: build:linux
          - name: windows
            os: windows-latest
            script: build:win
    defaults:
      run:
        # En PowerShell, npm se come el "--" que separa los argumentos del script
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verificar que el tag coincide con la versión de package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de package.json ($version)"
            exit 1
          fi

      - run: npm ci

      # --publish never: electron-builder no sube nada, el release lo arma el job de abajo
      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          # Los latest*.yml y el .blockmap son los metadatos de auto-actualización
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Crear el release, o agregarle los assets si ya existe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
