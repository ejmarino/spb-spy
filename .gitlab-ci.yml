# Empaqueta la app para Linux y Windows cuando se sube un tag de versión
# (v1.2.3). Los paquetes quedan como artifacts de cada job.

stages:
  - build

.build:
  stage: build
  # Node 24 con Wine: electron-builder lo necesita para armar el instalador
  # de Windows desde Linux
  image: electronuserland/builder:24-wine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  variables:
    # Historial completo con los tags: la versión se calcula a partir de ellos
    GIT_DEPTH: 0
  before_script:
    - npm ci
    - |
      version="v$(npx --no-install absolute-version-from-git-tag)"
      if [ "$version" != "$CI_COMMIT_TAG" ]; then
        echo "La versión calculada ($version) no coincide con el tag $CI_COMMIT_TAG"
        exit 1
      fi

build:linux:
  extends: .build
  script:
    # --publish never: electron-builder no intenta subir nada por su cuenta
    - npm run build:linux -- --publish never
  artifacts:
    paths:
      - dist/*.AppImage
      - dist/*.deb

build:windows:
  extends: .build
  script:
    - npm run build:win -- --publish never
  artifacts:
    paths:
      - dist/*.exe
